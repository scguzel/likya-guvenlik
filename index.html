<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Likya Yolu gelişmiş interaktif harita - GPX destekli, yükseklik profili, su kaynakları ve risk analizi">
    <meta name="keywords" content="Likya Yolu, GPX, harita, trekking, hiking, yükseklik profili">
    <meta name="theme-color" content="#1e40af">
    
    <title>Likya Yolu - Gelişmiş İnteraktif Harita Sistemi</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #1e40af;
            --primary-light: #3b82f6;
            --secondary-red: #dc2626;
            --secondary-green: #16a34a;
            --bg-light: #f1f5f9;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light);
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 380px;
            background: white;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-light));
            color: white;
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .controls {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-gps {
            background: linear-gradient(135deg, var(--secondary-green), #22c55e);
            color: white;
        }

        .btn-gps.active {
            background: var(--secondary-green);
        }

        .btn-layer {
            background: linear-gradient(135deg, #64748b, #94a3b8);
            color: white;
        }

        .btn-sos {
            background: linear-gradient(135deg, var(--secondary-red), #ef4444);
            color: white;
            font-size: 16px;
            padding: 16px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
            animation: pulse-sos 2s infinite;
        }

        @keyframes pulse-sos {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .content::-webkit-scrollbar {
            width: 8px;
        }

        .content::-webkit-scrollbar-thumb {
            background: var(--primary-blue);
            border-radius: 4px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .stage-card {
            padding: 12px;
            margin-bottom: 8px;
            background: #f8fafc;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stage-card:hover {
            border-color: var(--primary-blue);
            box-shadow: var(--shadow);
        }

        .stage-card.active {
            background: #eff6ff;
            border-color: currentColor;
        }

        .stage-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .stage-line {
            width: 32px;
            height: 4px;
            border-radius: 2px;
        }

        .stage-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .stage-info {
            font-size: 12px;
            color: var(--text-gray);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .elevation-chart {
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin-top: 12px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chart-bars {
            display: flex;
            align-items: flex-end;
            height: 120px;
            gap: 4px;
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(to top, var(--secondary-green), #22c55e);
            border-radius: 2px 2px 0 0;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chart-bar:hover {
            opacity: 0.8;
        }

        .chart-bar-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 600;
            color: var(--secondary-green);
            white-space: nowrap;
        }

        .chart-stats {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-gray);
        }

        .sos-section {
            padding: 16px;
            border-top: 2px solid #fee2e2;
        }

        /* Map Container */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            font-size: 12px;
            z-index: 1000;
        }

        .legend-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .legend-line {
            width: 24px;
            height: 3px;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            font-weight: 600;
            color: var(--primary-blue);
            z-index: 2000;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 50vh;
            }

            .map-container {
                height: 50vh;
            }

            .legend {
                bottom: 10px;
                right: 10px;
                font-size: 11px;
            }
        }

        /* Custom Leaflet Styles */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
        }

        .leaflet-popup-content {
            margin: 12px;
            font-family: 'Inter', sans-serif;
        }

        /* Water marker pulse animation */
        @keyframes water-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .water-marker {
            animation: water-pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Header -->
            <div class="sidebar-header">
                <h1>
                    <i class="fas fa-mountain"></i>
                    Likya Yolu Harita
                </h1>
                <p>3 Bölüm • 528 km • İnteraktif GPX</p>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn btn-gps" id="gpsBtn">
                    <i class="fas fa-location-crosshairs"></i>
                    <span id="gpsText">GPS'i Başlat</span>
                </button>
                <button class="btn btn-layer" id="layerBtn">
                    <i class="fas fa-layer-group"></i>
                    <span id="layerText">Uydu Görünümü</span>
                </button>
            </div>

            <!-- Content -->
            <div class="content">
                <h2 class="section-title">Etap Seçimi</h2>
                <div id="stagesList"></div>

                <!-- Elevation Chart -->
                <div id="elevationContainer" style="display: none;">
                    <div class="elevation-chart">
                        <div class="chart-title">
                            <i class="fas fa-chart-line"></i>
                            Yükseklik Profili
                        </div>
                        <div class="chart-bars" id="chartBars"></div>
                        <div class="chart-stats" id="chartStats"></div>
                    </div>
                </div>
            </div>

            <!-- SOS Button -->
            <div class="sos-section">
                <button class="btn btn-sos" onclick="window.location.href='tel:112'">
                    <i class="fas fa-phone-volume"></i>
                    ACİL DURUM - 112
                </button>
            </div>
        </aside>

        <!-- Map -->
        <div class="map-container">
            <div id="map"></div>
            
            <!-- Legend -->
            <div class="legend">
                <div class="legend-title">Lejant</div>
                <div class="legend-item">
                    <div class="legend-line" style="background: #dc2626;"></div>
                    <span>Bölüm 1 (140 km)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: #2563eb; border-top: 3px dashed;"></div>
                    <span>Bölüm 2 (170 km)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: #16a34a; border-top: 3px dotted;"></div>
                    <span>Bölüm 3 (218 km)</span>
                </div>
                <div class="legend-item">
                    <span style="font-size: 16px;">💧</span>
                    <span>Su Kaynağı</span>
                </div>
            </div>

            <!-- Loading -->
            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin"></i> Harita yükleniyor...
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
