# Netlify Yapılandırması - Likya Yolu Güvenlik Sistemi

[build]
  publish = "."
  command = "echo 'Statik dosyalar hazır'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "development" }

# API Yönlendirmesi
[[redirects]]
  from = "/api/*"
  to = "https://likya-guvenlik-api.onrender.com/api/:splat"
  status = 200
  force = false
